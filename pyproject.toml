[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pennyroyaltea-resume"
version = "0.1.0"
description = "Merged session picker for Codex and Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Boris Starkov" }]
keywords = ["codex", "claude", "cli", "sessions", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pennyroyaltea.github.io/resume/"
Repository = "https://github.com/PennyroyalTea/resume"
Issues = "https://github.com/PennyroyalTea/resume/issues"

[tool.setuptools]
packages = []
script-files = ["resume"]
